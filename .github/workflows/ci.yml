name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      SDL_PREFIX: ${{ runner.temp }}/sdl-prefix

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git \
            zlib1g-dev libmpg123-dev libfreetype-dev libharfbuzz-dev

      - name: Cache SDL3 + SDL3_ttf
        id: cache-sdl
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdl-prefix
          key: sdl-${{ runner.os }}-3.4.18-3.2.2-1

      - name: Build SDL3
        if: steps.cache-sdl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-3.4.18 \
            https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SDL_PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_INSTALL_TESTS=OFF \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_KMSDRM=OFF \
            -DSDL_VULKAN=OFF -DSDL_OPENGL=OFF -DSDL_OPENGLES=OFF \
            -DSDL_ALSA=OFF -DSDL_JACK=OFF -DSDL_PIPEWIRE=OFF \
            -DSDL_PULSEAUDIO=OFF -DSDL_SNDIO=OFF \
            -DSDL_DBUS=OFF -DSDL_LIBUDEV=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build "$RUNNER_TEMP/SDL/build" --parallel
          cmake --install "$RUNNER_TEMP/SDL/build"

      - name: Build SDL3_ttf
        if: steps.cache-sdl.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-3.2.2 \
            https://github.com/libsdl-org/SDL_ttf.git "$RUNNER_TEMP/SDL_ttf"
          cmake -S "$RUNNER_TEMP/SDL_ttf" -B "$RUNNER_TEMP/SDL_ttf/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SDL_PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_PREFIX_PATH="$SDL_PREFIX" \
            -DBUILD_SHARED_LIBS=ON \
            -DSDLTTF_VENDORED=OFF \
            -DSDLTTF_SAMPLES=OFF \
            -DSDLTTF_PLUTOSVG=OFF \
            -DSDLTTF_WERROR=OFF
          cmake --build "$RUNNER_TEMP/SDL_ttf/build" --parallel
          cmake --install "$RUNNER_TEMP/SDL_ttf/build"

      - name: Verify SDL install
        run: |
          test -f "$SDL_PREFIX/lib/pkgconfig/sdl3.pc"
          test -f "$SDL_PREFIX/lib/pkgconfig/sdl3-ttf.pc"

      - name: Configure rthim
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/sdl-prefix/lib/pkgconfig
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build rthim
        run: cmake --build build --parallel

      - name: Create a tiny test map
        run: |
          mkdir -p songs/ci
          cat > songs/ci/map.osu <<'EOF'
          osu file format v14

          [General]
          AudioFilename: audio.wav
          AudioLeadIn: 0
          PreviewTime: -1
          Mode: 0

          [Metadata]
          Title:CI Test
          TitleUnicode:CI Test
          Artist:CI
          ArtistUnicode:CI
          Creator:CI
          Version:CI
          Source:
          Tags:ci
          BeatmapID:0
          BeatmapSetID:-1

          [Difficulty]
          HPDrainRate:5
          CircleSize:4
          OverallDifficulty:8
          ApproachRate:9
          SliderMultiplier:3
          SliderTickRate:1

          [TimingPoints]
          0,500,4,2,1,80,1,0

          [HitObjects]
          256,192,1000,1,0,0:0:0:0:
          128,192,1500,1,0,0:0:0:0:
          EOF
          python3 - <<'PY'
          import wave
          with wave.open('songs/ci/audio.wav', 'wb') as w:
              w.setnchannels(2)
              w.setsampwidth(2)
              w.setframerate(48000)
              w.writeframes(b'\x00\x00\x00\x00' * 48000)
          PY

      - name: Headless smoke tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          LD_LIBRARY_PATH: ${{ runner.temp }}/sdl-prefix/lib
        run: |
          ./build/rthim --list
          ./build/rthim --selftest